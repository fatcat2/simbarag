services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=raggr
      - POSTGRES_PASSWORD=raggr_dev_password
      - POSTGRES_DB=raggr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raggr"]
      interval: 5s
      timeout: 5s
      retries: 5

  raggr:
    build:
      context: ./services/raggr
      dockerfile: Dockerfile.dev
    image: torrtle/simbarag:dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PAPERLESS_TOKEN=${PAPERLESS_TOKEN}
      - BASE_URL=${BASE_URL}
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - CHROMADB_PATH=/app/data/chromadb
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      - OIDC_USE_DISCOVERY=${OIDC_USE_DISCOVERY:-true}
      - DATABASE_URL=postgres://raggr:raggr_dev_password@postgres:5432/raggr
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
      - NODE_ENV=development
      - TAVILY_KEY=${TAVILIY_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - chromadb_data:/app/data/chromadb
    develop:
      watch:
        # Sync+restart on any file change under services/raggr
        - action: sync+restart
          path: ./services/raggr
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - "*.pyo"
            - "*.pyd"
            - .git/
            - chromadb/
            - node_modules/
            - raggr-frontend/dist/

volumes:
  chromadb_data:
  postgres_data:
