site_name: SimbaRAG Documentation
site_description: Documentation for SimbaRAG - RAG-powered conversational AI

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture:
      - Authentication: authentication.md
